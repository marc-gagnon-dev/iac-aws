# Copy to org.yaml and describe your organization. This is the only file a copy of the repo should change.
# Validated at startup (src/spec.ts); a mistake fails before anything is sent to AWS.

# Home region for the organization and every account provider.
region: us-east-1

# Root email for each member account. {account} becomes the account key below.
# Plus-addressing (you+tag@...) gives every account a unique email in one inbox.
accountEmail: you+aws-{account}@example.com

# This copy of the repo. Its pull requests get a read-only preview role and pushes to main a deploy role.
# Must match the repo part of the subject GitHub puts in its OIDC tokens. Repos created after
# 2026-07-15 use the immutable form <owner>@<owner-id>/<repo>@<repo-id>; get it with
#   gh api repos/<owner>/<repo>/actions/oidc/customization/sub --jq .sub_claim_prefix
# and drop the leading "repo:". The bootstrap wizard checks this for you.
selfRepo: your-github-user@1234567/your-iac-aws-copy@890123456

# Regions the region-guard SCP allows. Must include region.
allowedRegions: [us-east-1, us-west-2]

# OU paths. Parents are implied: Workloads/Prod creates Workloads too.
ous:
  - Security
  - Workloads/Prod
  - Workloads/NonProd
  - Sandbox

# SCP name (a file in policies/scp/) -> targets: root, an OU path, or an account key.
# AWS allows 4 of these per target on top of FullAWSAccess.
# SCPs never apply to the management account.
scps:
  deny-leave-org: [root]
  deny-root-user: [root]
  protect-iac-access: [root]
  region-guard: [Workloads, Sandbox]

# Account key -> account. The key is the account name and part of its email; treat it as permanent.
accounts:
  log-archive:
    ou: Security

  app-prod:
    ou: Workloads/Prod
    github:
      # Creates IAM role github-deploy, assumable by GitHub Actions jobs whose OIDC subject matches.
      # Use the subject form the workload repo's tokens carry (immutable for repos created after 2026-07-15).
      deploy:
        subjects: ["repo:your-github-user/app:environment:production"]
        policies: [arn:aws:iam::aws:policy/AdministratorAccess]

  app-dev:
    ou: Workloads/NonProd
    github:
      deploy:
        subjects: ["repo:your-github-user/app:ref:refs/heads/main"]
        policies: [arn:aws:iam::aws:policy/AdministratorAccess]
      plan:
        subjects: ["repo:your-github-user/app:pull_request"]
        policies: [arn:aws:iam::aws:policy/ReadOnlyAccess]

  # Adopt an account that is already in the organization instead of creating one (keys "root" and
  # "management" are reserved):
  # legacy:
  #   id: "123456789012"
  #   ou: Sandbox
  #   name: Legacy Account          # its current name and email, if they differ from the defaults
  #   email: old-root@example.com

# Optional. Human admins, signing in through IAM Identity Center with AdministratorAccess in every
# account, management included. Enable Identity Center once in the management account console, in
# `region`, and turn on "Send email OTP" (the bootstrap wizard walks through both). Each admin then
# signs in at the access portal (stack output accessPortalUrl) with their email, gets a one-time
# code by email, and sets a password and MFA.
identityCenter:
  admins:
    - email: you@example.com
      givenName: Your
      familyName: Name
  sessionHours: 8

# Optional. Monthly cost budgets in USD, kept in the management account. Each key is
# "organization" (every account together), "management", or an account key above.
# AWS emails everyone in `emails` when actual spend passes each percentage in `alerts`, and
# when the month is forecast to pass `forecastAlert`. At most 5 alerts in total per budget.
budgets:
  emails: [you@example.com]
  alerts: [50, 80, 100]
  forecastAlert: 100
  monthly:
    organization: 300
    management: 10
    app-prod: 200
    app-dev: 50
